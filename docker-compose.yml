# =====================================================================
# Stack completo AppBancaria — MySQL + API + frontend
#
# Uso da questo repository (appbancaria-api):
#   docker compose up -d              avvia i tre servizi (costruisce se mancano)
#   docker compose up -d --build      ricostruisce le immagini e avvia
#   docker compose logs -f            segue i log
#   docker compose down               ferma i container (i dati restano nel volume)
#   docker compose down -v            ferma tutto e CANCELLA i dati (ripartenza pulita)
#
# Il servizio web costruisce il frontend dal repository sibling
# ../appbancaria-web: clonare i due repo nella stessa cartella con questi
# nomi. Lo script ./avvia-tutto.sh fa gli stessi controlli e attende i
# healthcheck.
#
# Le credenziali qui sotto sono fittizie e valgono solo per questo
# ambiente dimostrativo locale: nessun dato o accesso reale.
# =====================================================================

services:
  mysql:
    image: mysql:8.4.11          # versione LTS, fissata: mai "latest"
    container_name: appbancaria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: appbancaria
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root-demo
    command:
      # utf8mb4: supporta accenti ed emoji senza sorprese
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Il server lavora in UTC: coerente con hibernate.jdbc.time_zone e con l'URL JDBC
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-dati:/var/lib/mysql
    healthcheck:
      # Indispensabile: senza questo, l'API puo partire prima che MySQL sia
      # pronto e Flyway fallirebbe la prima migrazione.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: appbancaria-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appbancaria-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: appbancaria
      DB_USER: demo
      DB_PASSWORD: demo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: appbancaria-web:latest
    build:
      context: ../appbancaria-web
      dockerfile: Dockerfile
    container_name: appbancaria-web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql-dati:
    name: appbancaria-mysql-dati
