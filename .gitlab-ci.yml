stages:
  - test
  - docker

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  script:
    - mvn -B verify
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

immagine-docker:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t appbancaria-api:$CI_COMMIT_SHORT_SHA .
